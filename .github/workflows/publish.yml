name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: ./opencode-observability
        run: npm ci

      - name: Run typecheck
        working-directory: ./opencode-observability
        run: npm run typecheck

      - name: Run tests
        working-directory: ./opencode-observability
        run: npm test

      - name: Build
        working-directory: ./opencode-observability
        run: npm run build

      - name: Publish to npm
        working-directory: ./opencode-observability
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}